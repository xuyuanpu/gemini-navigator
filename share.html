<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini 对话分享</title>
    <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
    <!-- 添加极简 Markdown 解析支持 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --primary-color: #1a73e8;
            --bg-color: #f8f9fa;
            --card-bg: #fff;
            --text-main: #202124;
            --text-secondary: #5f6368;
            --border-color: #dadce0;
            --user-bg: #ebf3ff;
            --user-border: #d2e3fc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
        }

        .doc-header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px 0;
        }

        .doc-title {
            font-size: 22px;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .doc-meta {
            color: var(--text-secondary);
            font-size: 12px;
            background: #eef2f6;
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
        }

        .dialogue-turn {
            margin-bottom: 24px;
        }

        .message-bubble {
            padding: 16px 20px;
            border-radius: 16px;
            margin-bottom: 8px;
            position: relative;
            max-width: 100%;
        }

        .user-message {
            background: var(--user-bg);
            border: 1px solid var(--user-border);
            border-bottom-left-radius: 4px;
        }

        .ai-message {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-top-left-radius: 4px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        .role-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--text-secondary);
        }

        .user-message .role-label { color: #1a73e8; }

        .message-content {
            font-size: 15px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        /* Markdown 解析后的样式 */
        .markdown-body {
            font-size: 15px;
        }
        .markdown-body pre {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 12px 0;
            font-family: 'SF Mono', Consolas, monospace;
            font-size: 13px;
        }
        .markdown-body code {
            background: rgba(0,0,0,0.05);
            padding: 2px 4px;
            border-radius: 4px;
            font-size: 90%;
        }
        .markdown-body pre code {
            background: transparent;
            padding: 0;
        }
        .markdown-body p { margin-bottom: 12px; }
        .markdown-body ul, .markdown-body ol { margin-left: 20px; margin-bottom: 12px; }
        .markdown-body blockquote {
            border-left: 4px solid #dadce0;
            padding-left: 16px;
            color: #5f6368;
            margin: 12px 0;
        }

        .error-container {
            text-align: center;
            padding: 80px 20px;
        }

        .loading {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
        }

        .footer {
            text-align: center;
            margin-top: 60px;
            color: #bdc1c6;
            font-size: 11px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        @media (max-width: 600px) {
            body { padding: 15px; }
            .message-bubble { padding: 12px 16px; }
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="loading">正在准备对话内容...</div>
    </div>

    <script>
        (function () {
            'use strict';

            const app = document.getElementById('app');

            function showError(message) {
                app.innerHTML = `
                    <div class="error-container">
                        <h2 style="color:#d93025">无法加载内容</h2>
                        <p style="margin-top:10px; color:#5f6368">${message}</p>
                    </div>
                `;
            }

            function renderDialogues(data) {
                // 处理新旧两种格式
                const isNewFormat = data.v === '2.0';
                const dialogues = isNewFormat ? data.d : data.dialogues;
                const exportTime = isNewFormat ? data.t : data.exportTime;
                
                const dialoguesHTML = dialogues.map(d => {
                    const userContent = isNewFormat ? d.u : d.userHTML;
                    const aiContent = isNewFormat ? d.a : d.aiHTML;
                    const index = isNewFormat ? d.i : d.index;
                    
                    return `
                        <div class="dialogue-turn">
                            ${userContent ? `
                            <div class="message-bubble user-message">
                                <div class="role-label">👤 USER</div>
                                <div class="message-content">${userContent}</div>
                            </div>
                            ` : ''}
                            
                            ${aiContent ? `
                            <div class="message-bubble ai-message">
                                <div class="role-label">✨ GEMINI</div>
                                <div class="message-content markdown-body">${isNewFormat ? marked.parse(aiContent) : aiContent}</div>
                            </div>
                            ` : ''}
                        </div>
                    `;
                }).join('');

                app.innerHTML = `
                    <div class="doc-header">
                        <h1 class="doc-title">✨ Gemini 对话分享</h1>
                        <div class="doc-meta">
                            ${exportTime ? `日期: ${exportTime} · ` : ''}
                            共 ${dialogues.length} 轮
                        </div>
                    </div>
                    
                    <div class="chat-container">
                        ${dialoguesHTML}
                    </div>
                    
                    <div class="footer">
                        Powered by Gemini Navigator · 由用户本地加密生成
                    </div>
                `;
            }

            function decodeData(encoded) {
                try {
                    const base64 = encoded.replace(/-/g, '+').replace(/_/g, '/');
                    const padding = '='.repeat((4 - base64.length % 4) % 4);
                    const binaryStr = atob(base64 + padding);
                    const bytes = new Uint8Array(binaryStr.length);
                    for (let i = 0; i < binaryStr.length; i++) {
                        bytes[i] = binaryStr.charCodeAt(i);
                    }
                    const decompressed = pako.inflate(bytes, { to: 'string' });
                    return JSON.parse(decompressed);
                } catch (e) {
                    console.error(e);
                    throw new Error('数据解码失败');
                }
            }

            function init() {
                const hash = window.location.hash.slice(1);
                if (!hash) {
                    showError('链接缺少数据参数');
                    return;
                }
                try {
                    const data = decodeData(hash);
                    renderDialogues(data);
                } catch (e) {
                    showError('加载失败，可能内容过大或链接不完整');
                }
            }

            // 检查外部库是否加载
            let checkCount = 0;
            const checker = setInterval(() => {
                if (typeof pako !== 'undefined' && typeof marked !== 'undefined') {
                    clearInterval(checker);
                    init();
                } else if (++checkCount > 50) {
                    clearInterval(checker);
                    showError('加载超时，请检查网络连接');
                }
            }, 100);
        })();
    </script>
</body>

</html>
